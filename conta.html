<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NULLWEAR</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="cabecalho">
    <div class="container cabecalho-linha">
      <a href="index.html" class="logo">NULLWEAR</a>

      <nav>
        <ul class="menu">
          <li><a href="index.html">Voltar à loja</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>

    <section class="secao">
      <div class="container">
        <h2>Entre ou crie sua conta para continuar</h2>
        <p>Para finalizar a compra, entre na sua conta ou cadastre-se.</p>

        <div class="contas">

          <form class="formulario" action="#" method="post">
            <fieldset>
              <legend>Entrar</legend>

              <div class="campo">
                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" name="login-email" placeholder="voce@email.com" required>
              </div>

              <div class="campo">
                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" name="login-senha" placeholder="Sua senha" required>
              </div>
            </fieldset>

            <button type="submit" class="botao">Entrar</button>
          </form>

          <form class="formulario" action="#" method="post">
            <fieldset>
              <legend>Criar conta</legend>

              <div class="campo">
                <label for="cad-nome">Nome completo</label>
                <input type="text" id="cad-nome" name="cad-nome" placeholder="Digite seu nome" required>
              </div>

              <div class="campo">
                <label for="cad-email">E-mail</label>
                <input type="email" id="cad-email" name="cad-email" placeholder="voce@email.com" required>
              </div>

              <div class="campo">
                <label for="cad-senha">Senha</label>
                <input type="password" id="cad-senha" name="cad-senha" placeholder="Crie uma senha" required>
              </div>
            </fieldset>

            <button type="submit" class="botao">Criar conta</button>
          </form>

        </div>
      </div>
    </section>

  </main>

  <footer class="rodape">
    <div class="container">
      <p class="logo">NULLWEAR</p>
      <nav>
        <ul class="menu">
          <li><a href="#" target="_blank" rel="noopener">Instagram</a></li>
          <li><a href="#" target="_blank" rel="noopener">Pinterest</a></li>
          <li><a href="#" target="_blank" rel="noopener">WhatsApp</a></li>
        </ul>
      </nav>
      <p>&copy; 2026 NULLWEAR. Todos os direitos reservados.</p>
    </div>
  </footer>

</body>
</html>
